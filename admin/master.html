<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JhonFS Admin [MASTER]</title>
  
  <link href="./config-master.yml" type="text/yaml" rel="cms-config-url" />

  <script>
    window.MathJax = {
      tex: {
        // Define os delimitadores: $$ para bloco, $ para inline
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      },
      // Faz o MathJax observar mudanças no DOM (importante para o CMS dinâmico)
      options: {
        enableMenu: false
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    /* Um detalhe visual para você saber que está no modo Deus */
    body { margin: 0; border-top: 5px solid gold; } 
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
</body>
</html>
