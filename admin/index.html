<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JhonFS Sanctum Manager</title>
  
  <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
  
  <script>
    // 1. Configuração Básica do MathJax
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' },
      // Importante: Dizemos para não rodar automaticamente no início,
      // pois vamos controlar manualmente com o Observador abaixo.
      startup: {
        typeset: false 
      }
    };
  </script>

  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let timeoutId = null;
      
      // Esta função acorda o MathJax, mas espera você parar de digitar por 300ms
      // para não travar o navegador (Debounce).
      const reRenderMath = () => {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          if (window.MathJax && window.MathJax.typesetPromise) {
            // Manda o MathJax varrer a página inteira em busca de novos $$
            window.MathJax.typesetPromise().catch((err) => console.log('MathJax Error:', err));
          }
        }, 300);
      };

      // Cria o Observador que detecta mudanças no HTML (digitação, novos blocos)
      const observer = new MutationObserver((mutations) => {
        // Se algo mudou na estrutura da página, chama a renderização
        reRenderMath();
      });

      // Começa a vigiar o corpo do site assim que carregar
      // Nota: childList e subtree garantem que pegamos mudanças profundas no CMS
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

  <style>
    body { margin: 0; background: #1a1a1a; color: #e5e5e5; font-family: sans-serif; }
    /* Ajuste opcional para garantir que as fórmulas não fiquem gigantes */
    mjx-container { max-width: 100%; overflow-x: auto; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
</body>
</html>
