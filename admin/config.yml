backend:
  name: github
  repo: Jhonatafs/jhonfs-ecosystem
  branch: main
  # ⚠️ ATENÇÃO: Este endpoint de autenticação é provisório.
  # Na Fase 3, configuraremos o Cloudflare Worker para lidar com o login.
  # Por enquanto, o CMS pedirá um "Personal Access Token" se o login falhar,
  # o que é aceitável para testes locais.
  auth_endpoint: https://auth.jhonfs-sanctum.workers.dev

# Configurações de Mídia
media_folder: "src/static/assets/uploads" # Onde salvar no repo
public_folder: "/assets/uploads" # Como ler no HTML

# Workflow: O "editorial_workflow" ativa o fluxo: Rascunho -> PR -> Aprovação
publish_mode: editorial_workflow
show_preview_links: true

# Definição das Coleções de Conteúdo
collections:
  # 1. Blog (Público)
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
        }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  # 2. Sanctum (Privado/Restrito)
  - name: "sanctum"
    label: "Sanctum (Área Privada)"
    folder: "content/sanctum"
    create: true
    extension: "md"
    fields:
      - { label: "Identificador (Slug)", name: "title", widget: "string" }
      - { label: "Conteúdo Privado", name: "body", widget: "markdown" }

  # 3. Projetos
  - name: "projects"
    label: "Projetos"
    folder: "content/projects"
    create: true
    fields:
      - { label: "Nome do Projeto", name: "title", widget: "string" }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["WIP", "Live", "Archived"],
        }
      - { label: "Tecnologias", name: "tech", widget: "list" }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Descrição", name: "body", widget: "markdown" }
