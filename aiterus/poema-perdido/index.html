<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Canto do Vento | Aiterus</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/aiterus.css">
</head>
<body>
    <main>
        
<article>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2rem; border-bottom: 1px dashed var(--ui-border); padding-bottom: 1rem;">
        <h1 style="margin: 0; color: var(--accent-primary);">O Canto do Vento</h1>
        <span style="background: var(--ui-border); padding: 2px 8px; font-size: 0.8rem; font-family: var(--font-stack-mono);">Poesia</span>
    </div>

    <div style="display: grid; grid-template-columns: 3fr 1fr; gap: 3rem;">
        
        <div class="lore-text" style="line-height: 1.8;">
            <p>O vento sopra onde quer, E ouves a sua voz… Mas não sabes de onde
vem, Nem para onde vai.</p>

        </div>

        
        <aside style="background: var(--bg-surface); padding: 1.5rem; height: fit-content; border-radius: 4px;">
            <h3 style="margin-top: 0; font-size: 1rem; border-bottom: 1px solid var(--ui-border); padding-bottom: 0.5rem;">Dados</h3>
            
            <div style="margin-bottom: 0.8rem; font-size: 0.9rem;">
                <strong style="display: block; color: var(--text-muted); font-size: 0.8em; text-transform: uppercase;">Autor</strong>
                <span>Desconhecido</span>
            </div>
            
            <div style="margin-bottom: 0.8rem; font-size: 0.9rem;">
                <strong style="display: block; color: var(--text-muted); font-size: 0.8em; text-transform: uppercase;">Era</strong>
                <span>Segunda Era</span>
            </div>
            
        </aside>
        
    </div>
</article>

<div style="margin-top: 4rem;">
    <a href="/aiterus">← Voltar ao Portal</a>
</div>

    </main>

    <footer class="aiterus-footer">
        <div>Sistema de Arquivos Aiterus</div>
        <nav class="aiterus-nav">
            <a href="/">[root]</a>
            <a href="/blog">~/blog</a>
            <a href="/projects">~/projects</a>
        </nav>
    </footer>
</body>
</html>
