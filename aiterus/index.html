<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiterus</title>

    <link rel="icon" type="image/png" href="/img/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/img/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/img/favicon/site.webmanifest" />

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/aiterus.css">
</head>
<body>
    <main>
        
<header class="library-header">
    <h1 class="library-title">Acervo de Aiterus</h1>
    <div class="library-subtitle">Biblioteca Publica</div>
</header>

<div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar no acervo..." autocomplete="off">
</div>

<section class="archive-list" id="itemsContainer">
    
    <a href="/aiterus/relatório-técnico-sistema-solar-planeta/" class="archive-item" 
       data-title="None" 
       data-type="Geral">
        
        <div>
            <span class="item-title">None</span>
            <span class="item-type">Geral</span>
        </div>
    </a>
    
    
    <div id="noResults" class="hidden" style="text-align: center; color: var(--text-muted); padding: 2rem;">
        Nenhum registro encontrado nos arquivos.
    </div>
</section>

<script>
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const items = document.querySelectorAll('.archive-item');
        let visibleCount = 0;

        items.forEach(item => {
            const title = item.getAttribute('data-title').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const type = item.getAttribute('data-type').toLowerCase();
            
            if (title.includes(term) || type.includes(term)) {
                item.classList.remove('hidden');
                visibleCount++;
            } else {
                item.classList.add('hidden');
            }
        });

        const noResults = document.getElementById('noResults');
        if (visibleCount === 0) noResults.classList.remove('hidden');
        else noResults.classList.add('hidden');
    });
</script>

    </main>

    <footer class="aiterus-footer">
        <div>Sistema de Arquivos Aiterus</div>
        <nav class="aiterus-nav">
            <a href="/">[root]</a>
            <a href="/blog">~/blog</a>
            <a href="/projects">~/projects</a>

            <button onclick="window.cycleTheme()" class="theme-trigger">
                    <span class="cmd-prefix">$ theme.set</span>
                    <span id="theme-display">[ CODEX.SYS ]</span>
            </button>
        </nav>
    </footer>
    <script src="/js/theme-engine.js"></script>
</body>
</html>
